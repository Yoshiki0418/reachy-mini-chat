[project]
name = "reachy-server"
version = "0.1.0"
description = "研究室 GPU マシン上の生成バックエンド（STT・応答生成・TTS・会話履歴）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "reachy-protocol",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "pydantic-settings>=2.6",
    "langchain-core>=1.4.8",  # LLMProvider が返すチャットモデルの型
    "langgraph>=1.2.7",  # 会話エージェント
    "langchain-openai>=1.3.3",  # llm=openai（使うときだけ import）
    "langgraph-checkpoint-sqlite>=3.0",
]

[dependency-groups]
# このパッケージ単体のテスト用（CI は `uv sync --package reachy-server --group dev`）
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",  # FastAPI の TestClient（WebSocket の結合テスト）
]
# GPU 推論。CI には入れない。TTS（Irodori-TTS）は依存の版が合わないので別環境（#19）。
gpu = [
    "faster-whisper==1.2.1",
    "av>=11,<19",  # 19 で av.open の metadata_errors が消え、faster-whisper の decode_audio が落ちる
    "nvidia-cublas-cu12>=12.8,<13",  # ctranslate2 が実行時に CUDA 12 の cuBLAS を探す
]

[tool.uv.sources]
reachy-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.10,<0.11"]
build-backend = "uv_build"
