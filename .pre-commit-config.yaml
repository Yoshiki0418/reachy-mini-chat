# セットアップ: uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# 全ファイルに実行: uv run pre-commit run --all-files
#
# すべて repo: local + uv run。uv.lock で固定したツールを使うので CI と版がずれない。
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: check-secrets
        name: 秘密情報・個人データのチェック
        entry: uv run --no-sync python scripts/dev/check_secrets.py
        language: system
        types: [file]

      - id: ruff-check
        name: ruff check --fix
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: pyright
        name: pyright (pre-push)
        entry: uv run --no-sync pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]
