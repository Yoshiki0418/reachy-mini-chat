name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  # CI では ML 依存（torch / whisper / SBV2）を入れない
  UV_SYNC_ARGS: "--locked --no-default-groups --group dev"

jobs:
  lock:
    name: uv.lock 整合
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv lock --check

  lint:
    name: Lint / Format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync ${{ env.UV_SYNC_ARGS }}
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check --diff .
      - name: 秘密情報・個人データのチェック（git 管理下の全ファイル）
        run: uv run --no-sync python scripts/dev/check_secrets.py --all

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync ${{ env.UV_SYNC_ARGS }}
      - run: uv run --no-sync pyright

  # パッケージごとに「そのパッケージの依存だけ」で環境を作ってテストする。
  # ロボット（CM4 の apps_venv）とサーバーの依存が混ざっていないこと自体を検証する。
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: legacy
            sync: --locked --no-default-groups --group dev
            paths: tests
            cov: --cov=pc_server --cov=robot
          - name: protocol
            sync: --locked --package reachy-protocol --group dev
            paths: protocol/tests
            cov: --cov=reachy_protocol
          - name: robot
            sync: --locked --package reachy-front --group dev
            paths: robot_app/tests
            cov: --cov=reachy_front
          - name: server
            sync: --locked --package reachy-server --group dev
            paths: server/tests
            cov: --cov=reachy_server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync ${{ matrix.sync }}
      - name: pytest
        env:
          # 外部 API を誤って叩かないよう、ダミーキーで固定
          OPENAI_API_KEY: sk-ci-dummy
        # `uv run --package` は --no-sync と併用できないので venv の python を直接使う
        run: >-
          .venv/bin/python -m pytest -m "not robot" ${{ matrix.paths }}
          ${{ matrix.cov }} --cov-report=term-missing:skip-covered --cov-report=xml
          --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage (${{ matrix.name }})'
            echo '```'
            .venv/bin/python -m coverage report --skip-covered --skip-empty | tail -n 30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: |
            junit.xml
            coverage.xml

  # ブランチ保護で「必須チェック」に指定する集約ジョブ
  ci-ok:
    name: CI OK
    if: always()
    needs: [lock, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          exit 1
      - run: echo "all green"
