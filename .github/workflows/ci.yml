name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  # CI では ML 依存（torch / whisper / SBV2）を入れない
  UV_SYNC_ARGS: "--locked --no-default-groups --group dev"

jobs:
  lock:
    name: uv.lock 整合
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv lock --check

  lint:
    name: Lint / Format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync ${{ env.UV_SYNC_ARGS }}
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check --diff .
      - name: 秘密情報・個人データのチェック（git 管理下の全ファイル）
        run: uv run --no-sync python scripts/dev/check_secrets.py --all

  typecheck:
    name: Typecheck (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync ${{ env.UV_SYNC_ARGS }}
      - run: uv run --no-sync pyright

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync ${{ env.UV_SYNC_ARGS }}
      - name: pytest
        env:
          # 外部 API を誤って叩かないよう、ダミーキーで固定
          OPENAI_API_KEY: sk-ci-dummy
        run: >-
          uv run --no-sync pytest -m "not robot"
          --cov --cov-report=term-missing:skip-covered --cov-report=xml
          --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            uv run --no-sync coverage report --skip-covered --skip-empty | tail -n 30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  # ブランチ保護で「必須チェック」に指定する集約ジョブ
  ci-ok:
    name: CI OK
    if: always()
    needs: [lock, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          exit 1
      - run: echo "all green"
